<mat-toolbar color="primary">
    <span>Banking Dashboard</span>
    <span class="spacer"></span>
    <button mat-button (click)="onLogout()">Logout</button>
</mat-toolbar>


<div class="dashboard-container">
    <h2>Welcome to Your Banking Dashboard</h2>
    <div class="stats-cards">
        <mat-card class="stat-card">
            <mat-card-title>Total Balance</mat-card-title>
            <mat-card-content>
                <h3>{{ totalBalance | currency }}</h3>
            </mat-card-content>
        </mat-card>

        <mat-card class="stat-card">
            <mat-card-title>Recent Transactions</mat-card-title>
            <mat-card-content>
                <table mat-table [dataSource]="recentTransactions" class="mat-elevation-z8">
                    <ng-container matColumnDef="date">
                        <th mat-header-cell *matHeaderCellDef>Date</th>
                        <td mat-cell *matCellDef="let transaction">{{ transaction.date | date }}</td>
                    </ng-container>

                    <ng-container matColumnDef="description">
                        <th mat-header-cell *matHeaderCellDef>Description</th>
                        <td mat-cell *matCellDef="let transaction">{{ transaction.description }}</td>
                    </ng-container>

                    <ng-container matColumnDef="amount">
                        <th mat-header-cell *matHeaderCellDef>Amount</th>
                        <td mat-cell *matCellDef="let transaction">{{ transaction.amount | currency }}</td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </mat-card-content>
        </mat-card>
    </div>
