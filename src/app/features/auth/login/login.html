<div class="login-page">
    <mat-card class="login-card">
        <div class="brand-logo">
            <span class="logo-icon">🏦</span>
            <h1>BankPro</h1>
        </div>

        <h2 class="login-title">Secure Login</h2>

        <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)" autocomplete="off">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Username</mat-label>
                <input matInput [(ngModel)]="username" name="username" required #usernameCtrl="ngModel"
                    #usernameInput />
                <mat-error *ngIf="usernameCtrl.invalid && usernameCtrl.touched">
                    Username is required
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Password</mat-label>
                <input matInput [(ngModel)]="password" type="password" name="password" required
                    #passwordCtrl="ngModel" />
                <mat-error *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
                    Password is required
                </mat-error>
            </mat-form-field>

            <button mat-raised-button color="primary" class="login-btn" type="submit"
                [disabled]="loading || loginForm.invalid">
                <ng-container *ngIf="!loading">Login</ng-container>
                <mat-spinner *ngIf="loading" diameter="24"></mat-spinner>
            </button>

            <div *ngIf="error" class="error-message">{{ error }}</div>
        </form>

        <footer>
            <p class="footer">© {{ currentYear }} MyBank. All rights reserved.</p>
        </footer>
    </mat-card>
</div>
