<div class="login-container">
    <mat-card class="login-card">
        <h2>Secure Banking Login</h2>

<form #loginForm="ngForm" (ngSubmit)="submit(loginForm)">
    <mat-form-field appearance="fill" style="width: 100%">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" name="username" required #usernameCtrl="ngModel" />
        <mat-error *ngIf="usernameCtrl.invalid && usernameCtrl.touched">
            Username is required
        </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" style="width: 100%">
        <mat-label>Password</mat-label>
        <input matInput [(ngModel)]="password" type="password" name="password" required #passwordCtrl="ngModel" />
        <mat-error *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
            Password is required
        </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loading || loginForm.invalid"
        style="width: 100%">
        <span *ngIf="!loading">Login</span>
        <mat-spinner *ngIf="loading" diameter="24"></mat-spinner>
    </button>

            <p *ngIf="error" style="color:red; text-align:center;">{{ error }}</p>
        </form>
    </mat-card>
</div>
